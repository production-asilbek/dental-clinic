name: iOS Build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: pod install # Skip if not using CocoaPods
      - name: Compile App
        run: xcodebuild -workspace ios/YourApp.xcworkspace -scheme YourScheme -sdk iphoneos clean build CODE_SIGNING_ALLOWED=NO
